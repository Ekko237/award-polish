<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>联系松木工作室｜开启一次合作</title><meta name="description" content="告诉松木工作室你的项目方向、时间安排和期待。"><link rel="canonical" href="https://pinewood.studio/contact.html"><link rel="stylesheet" href="styles.css"></head>
<body>
  <header class="site-header"><a class="wordmark" href="index.html">PINEWOOD<span>松木工作室</span></a><nav><a href="work.html">作品</a><a href="contact.html" aria-current="page">联系</a><a class="nav-button" href="contact.html">聊聊项目 ↗</a></nav></header>
  <main class="contact-page">
    <section class="page-intro"><p class="eyebrow">Start a conversation</p><h1>手上有个好想法？</h1><p>介绍一下你正在做的事，我们会在两个工作日内回复。</p></section>
    <section class="contact-layout"><div class="contact-aside"><h2>从这里开始</h2><p>简单说说项目、目前卡住的地方，以及希望什么时候开始。</p><a href="mailto:hello@pinewood.studio">hello@pinewood.studio ↗</a><p>上海 · 远程合作</p></div>
      <form class="contact-form" id="contact-form" novalidate>
        <label for="name">怎么称呼你</label><input id="name" name="name" autocomplete="name" placeholder="你的名字">
        <label for="email">邮箱地址</label><input id="email" name="email" inputmode="email" autocomplete="email" placeholder="name@example.com">
        <label for="project">项目大概是什么</label><textarea id="project" name="project" rows="5" placeholder="写下你想一起完成的事"></textarea>
        <button class="button" type="submit">发送项目介绍 <span>↗</span></button>
        <p class="form-status" id="form-status" data-invalid-message="邮箱格式不对，请检查有没有漏写 @，比如 name@example.com" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <footer class="site-footer"><a class="wordmark" href="index.html">PINEWOOD<span>松木工作室</span></a><p>认真生长，持续创造。</p><a href="work.html">回到作品 ↗</a></footer>
  <script src="main.js"></script>
</body>
</html>
