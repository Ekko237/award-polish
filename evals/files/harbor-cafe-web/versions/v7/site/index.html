<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>港湾咖啡｜河边的一张桌</title>
  <meta name="description" content="港湾咖啡在上海杨浦沿江路，手冲咖啡和当日烘焙，可以在线预订座位。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">港湾咖啡 <span>HARBOR COFFEE</span></a>
    <nav class="site-nav">
      <div class="nav-links">
        <a href="menu.html">菜单</a>
        <a href="index.html#visit">到店</a>
        <a href="booking.html">预订</a>
      </div>
    </nav>
  </header>
  <main>
    <section class="hero">
      <div class="hero-text">
        <p class="eyebrow">河边的一张桌 · 自 2018</p>
        <h1>港湾咖啡</h1>
        <p class="lead">在港湾，慢慢喝一杯。手冲咖啡、当日烘焙，和一段不用赶路的时间。</p>
        <div class="visit-info" id="visit">
          <div class="visit-hours"><span class="label">营业时间</span><p>周一至周五 08:00 至 18:00，周末 09:00 至 19:00</p></div>
          <div class="visit-address"><span class="label">地址</span><p>上海市杨浦区沿江路 18 号，渡口往东 200 米</p></div>
        </div>
        <a class="btn btn-primary" href="booking.html">预订座位</a>
      </div>
      <div class="hero-art"><img src="assets/hero.png" alt="江边的港湾咖啡店面和门口的桌椅" width="1200" height="960"></div>
    </section>
    <section class="signature">
      <div class="section-head">
        <h2>招牌饮品</h2>
        <a href="menu.html">看完整菜单</a>
      </div>
      <div class="cards">
        <article class="card">
          <img src="assets/oat-latte.png" alt="一杯燕麦拿铁放在浅色木桌上" width="720" height="540">
          <h3>燕麦拿铁</h3>
        </article>
        <article class="card">
          <img src="assets/pour-over.png" alt="滤杯架在白色杯子上的手冲咖啡" width="720" height="540">
          <h3>季节手冲</h3>
        </article>
        <article class="card">
          <img src="assets/cold-brew.png" alt="加了冰块的玻璃杯冷萃咖啡" width="720" height="540">
          <h3>港湾冷萃</h3>
        </article>
      </div>
    </section>
  </main>
  <footer class="site-footer" id="contact">
    <p>港湾咖啡 · 沿着江风找到我们</p>
    <p>上海市杨浦区沿江路 18 号，渡口往东 200 米 · 电话 021 6555 0188</p>
  </footer>
  <script src="main.js"></script>
</body>
</html>
