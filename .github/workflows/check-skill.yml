name: Check skill

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SKILL.md frontmatter
        run: python3 .github/scripts/check_skill_frontmatter.py

      - name: Syntax-check scripts
        run: python3 -m py_compile skills/award-polish/scripts/*.py
